<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; img-src 'self' data: blob:; connect-src 'self'">
<title>성현교회 재정</title>
<style>
:root{
  --bg:#f3f2ee; --surface:#ffffff; --sunk:#ebe9e3; --fg:#1b1f26; --muted:#454c57; --line:#d8d5cc;
  --accent:#27466e; --accent-ink:#ffffff; --accent-soft:#e1e8f2;
  --ok:#1f6b4f; --ok-soft:#dcefe5; --warn:#94560a; --warn-soft:#f7e9d3; --danger:#b42318; --danger-soft:#f9e0dc;
  --inc:#1f6b4f; --exp:#9c3d2a;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151a; --surface:#1a1e25; --sunk:#0e1115; --fg:#e6e9ee; --muted:#b8c0cc; --line:#2d333d;
  --accent:#8fb3e3; --accent-ink:#0d1622; --accent-soft:#1f2d42;
  --ok:#6cc79f; --ok-soft:#173326; --warn:#e5a54c; --warn-soft:#3a2a12; --danger:#f17d70; --danger-soft:#3e1c18;
  --inc:#6cc79f; --exp:#ec9a86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151a; --surface:#1a1e25; --sunk:#0e1115; --fg:#e6e9ee; --muted:#b8c0cc; --line:#2d333d;
  --accent:#8fb3e3; --accent-ink:#0d1622; --accent-soft:#1f2d42;
  --ok:#6cc79f; --ok-soft:#173326; --warn:#e5a54c; --warn-soft:#3a2a12; --danger:#f17d70; --danger-soft:#3e1c18;
  --inc:#6cc79f; --exp:#ec9a86; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);margin:0;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100%}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:4px 10px 18px}
.brand b{font:700 21px/1.2 var(--f-display);display:block;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:13px}
nav.side button{all:unset;cursor:pointer;padding:9px 12px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--fg)}
nav.side button:hover{background:var(--sunk)}
nav.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.side .grp{font-size:12.5px;color:var(--muted);letter-spacing:.08em;padding:14px 12px 4px}
nav.side .foot{margin-top:auto;padding:12px 12px 0;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
main{padding-block:24px 60px;padding-inline:28px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.head h1{font:700 26px/1.2 var(--f-display);margin:0}
.head p{margin:4px 0 0;color:var(--muted);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:14px}
.btn.link{border:0;background:none;padding:2px 4px;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=date],input[type=month],input[type=number],input[type=password],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
textarea{width:100%;min-height:70px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea{font-weight:400;color:var(--fg);font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:7px 13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel h2{font-size:15px;margin:0 0 10px}
main>.panel+.panel,main>.grid2+.panel{margin-top:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi span{color:var(--muted);font-size:13.5px;font-weight:600}
.kpi b{display:block;font-size:24px;line-height:1.25;margin-top:2px}
.kpi small{color:var(--muted);font-weight:500;font-size:13px}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0;z-index:1}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
tr.sub td{background:var(--sunk);font-weight:600}
tr.tot td{background:var(--accent-soft);font-weight:700;color:var(--fg)}
.num{text-align:right}
td.num,th.num{text-align:right}
.pill{display:inline-block;font-size:12.5px;padding:1px 8px;border-radius:10px;background:var(--sunk);color:var(--muted);font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted);font-weight:500}
.inc{color:var(--inc)} .exp{color:var(--exp)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);color:var(--accent);border-radius:var(--r);padding:10px 14px;margin-bottom:16px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1 1 160px}
/* 주일 헌금 입력 그리드 */
.grid-in{max-height:calc(100vh - 230px)}
.grid-in td{padding:0;border-right:1px solid var(--line)}
.grid-in td.nm{padding:5px 10px;position:sticky;left:0;background:var(--surface);z-index:1;font-weight:600}
.grid-in td.no{padding:5px 8px;color:var(--muted);text-align:right;width:40px}
.grid-in th{border-right:1px solid var(--line);text-align:center}
.grid-in input{all:unset;box-sizing:border-box;width:100%;min-width:66px;padding:6px 6px;text-align:right;font-variant-numeric:tabular-nums}
.grid-in input.memo{text-align:left;min-width:120px}
.grid-in input:focus{background:var(--accent-soft);outline:2px solid var(--accent);outline-offset:-2px}
.grid-in tr.has td.nm{color:var(--accent)}
.grid-in td.sum{padding:5px 10px;text-align:right;font-weight:600;background:var(--sunk)}
.grid-in tfoot td{position:sticky;bottom:0;z-index:2;background:var(--accent-soft);font-weight:700;padding:7px 10px;text-align:right;border-top:2px solid var(--accent)}
.grid-in tfoot td:first-child,.grid-in tfoot td:nth-child(2){text-align:left}
/* 막대 */
.bars{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:22px;border-bottom:1px solid var(--line)}
.bar{flex:1;background:var(--accent);border-radius:4px 4px 0 0;position:relative;min-width:6px;opacity:.85}
.bar:last-child{opacity:1}
.bar i{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11.5px;color:var(--muted);white-space:nowrap}
.bar-x{display:flex;gap:6px;margin-top:4px}
.bar-x span{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.over i{background:var(--danger)}
.meter.good i{background:var(--ok)}
/* 오버레이 */
.ov{position:fixed;inset:0;background:rgba(10,14,20,.48);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--surface);border-radius:12px;padding:20px 22px;width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.dlg.wide{width:min(1000px,100%)}
.dlg h2{margin:0 0 14px;font:700 20px/1.3 var(--f-display)}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:60;max-width:calc(100% - 32px)}
.lock{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:80}
.lock .panel{width:min(360px,92vw);text-align:center}
.lock h1{font:700 24px var(--f-display);margin:0 0 6px}
.hint{font-size:13.5px;color:var(--muted);margin-top:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0}
kbd{font:12px var(--f-body);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
@media (max-width:800px){.app{grid-template-columns:1fr} nav.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap} main{padding-inline:16px}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>
<div id="layer"></div>
<script src="defaults.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="core.js"></script>
<script src="io.js"></script>
<script src="reports.js"></script>
<script src="views.js"></script>
</body>
</html>
